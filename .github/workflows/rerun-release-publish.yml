# One-shot: re-run the v1.0.0 Release workflow after NPM_TOKEN was added.
# Safe to delete this file (and .github/trigger-release-rerun) after publish succeeds.
name: Re-run release publish

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-release-rerun'

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run Release workflow run 38282843639
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: 38282843639,
            });
